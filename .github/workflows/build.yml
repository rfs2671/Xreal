name: build
on:
  push:
    branches: ["claude/**", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK; Gradle fetches the pinned NDK and CMake itself.
      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit tests and APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Check native libraries are 16 KB page aligned
        run: |
          set -e
          mkdir -p /tmp/apk && cd /tmp/apk && unzip -q -o "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" 'lib/*'
          for so in lib/arm64-v8a/*.so; do
            align=$(readelf -lW "$so" | awk '/LOAD/ {print $NF}' | sort -u | tr '\n' ' ')
            echo "$so: $align"
            case "$align" in *0x1000*) echo "not 16 KB aligned: $so"; exit 1;; esac
          done
      - name: Name the APK
        run: |
          v=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "ultra-xr-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-xr-apk
          path: ultra-xr-*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/test-results/

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK; Gradle fetches the pinned NDK and CMake itself.
      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The app ships arm64 libraries only; Android 11+ x86_64 images translate arm64 code.
      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb shell getprop ro.product.cpu.abilist
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || (adb logcat -d -t 3000 > logcat.txt; exit 1)
            adb logcat -d -t 3000 > logcat.txt || true
            adb pull /sdcard/Android/data/dev.ultraxr/files/screens screens || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screens/
            logcat.txt

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          files = glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          print('result files:', len(files))
          for f in files:
              s = open(f, errors='replace').read()
              m = re.search(r'tests="(\d+)"[^>]*failures="(\d+)"', s)
              print(f.split('/')[-1], m.group(0) if m else '')
              for t in re.finditer(r'<testcase name="([^"]+)"[^>]*>\s*<(failure|error)[^>]*>(.{0,1500})', s, re.S):
                  print('FAILED', t.group(1)); print(t.group(3)[:1500]); print('---')
          PY
          echo "== logcat extract =="
          grep -E "FATAL EXCEPTION|AndroidRuntime|UnsatisfiedLink|dlopen failed|UltraXR|ultra_vio|ultra_hands|TestRunner|SIGSEGV|SIGILL|SIGABRT|backtrace|Abort message" logcat.txt | tail -n 70 || true

  release:
    needs: [apk, emulator]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ultra-xr-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          tag="v$v-build${{ github.run_number }}"
          cp extras/hello_xr-vulkan.apk hello_xr-vulkan.apk; cp extras/hello_xr-opengles.apk hello_xr-opengles.apk
          gh release create "$tag" ultra-xr-*.apk hello_xr-vulkan.apk hello_xr-opengles.apk --target "${{ github.sha }}" --title "Ultra XR $v (build ${{ github.run_number }})" \
            --notes-file docs/RELEASE_NOTES.md --prerelease
